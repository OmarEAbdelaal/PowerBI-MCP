[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerbi-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server that connects Claude to Microsoft Power BI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "msal>=1.28",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
powerbi-mcp = "powerbi_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
